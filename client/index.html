<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <script>
      try {
        var s = JSON.parse(localStorage.getItem('mailbox.settings') || '{}');
        var dark = s.theme === 'dark' || (s.theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.dataset.density = s.density || 'default';
      } catch (e) {}
    </script>
    <title>Mailbox</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
